[tool.poetry]
name = "pytune_data"
version = "1.2.4"
description = "PyTune project - Data Layer"
authors = ["Gabriel de Fombelle <gabriel.de.fombelle@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/gdefombelle/pytune_data"


[tool.poetry.dependencies]
python = "^3.12"

setuptools = "*"
tortoise-orm = "*"
numpy = "*"
fastapi = "*"
typing = "*"
asyncpg = "*"
pydantic = { version = "*", extras = ["email"] }

# Dépendances internes
simple_logger ={ git = "https://github.com/gdefombelle/simple_logger.git" }
pytune_configuration = { git = "https://github.com/gdefombelle/pytune_configuration.git" }
unidecode = "^1.3.8"
openai = "^1.63.0"

[tool.poetry.dev-dependencies]
pytest = "^7.0"
pytest-asyncio = "^0.20.3"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
