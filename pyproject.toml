[project]
name = "pytune_data"
version = "1.3.0"
description = "PyTune shared data models"
requires-python = ">=3.12,<3.13"

dependencies = [
    "tortoise-orm>=0.20",
    "numpy>=1.26",
    "fastapi>=0.115.0",
    "typing-extensions>=4.0",
    "asyncpg>=0.30",
    "pydantic[email]>=2.8.0",
    "unidecode>=1.3",
    "openai>=1.63.0",
    "minio>=7.2",
    "qdrant-client>=1.14",
    "rapidfuzz>=3.13",

    # internes (résolus automatiquement, via workspace)
    "simple_logger",
    "pytune_configuration",
    "pytune_helpers_images",
    "pytune_llm",
    "pytune_chat",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pytune_data"]