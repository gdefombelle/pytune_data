[project]
name = "pytune_data"
version = "0.0.0"
description = "PyTune shared data models"
requires-python = ">=3.12"

[tool.poetry]
name = "pytune_data"
version = "1.3.0"
description = "PyTune project - Data Layer"
authors = ["Gabriel de Fombelle <gabriel.de.fombelle@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/gdefombelle/pytune_data"
packages = [{ include = "pytune_data" }]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"

setuptools = "*"
tortoise-orm = "*"
numpy = "*"
fastapi = "*"
typing = "*"
asyncpg = "*"
pydantic = { version = "*", extras = ["email"] }

# Dépendances internes DEV + PROD
pytune_helpers_images = {git  = "https://github.com/gdefombelle/pytune_helpers_images.git", branch = "main"}
pytune_llm = { git = "https://github.com/gdefombelle/pytune_llm.git", branch = "main" }
pytune_chat = { git = "https://github.com/gdefombelle/pytune_chat.git", branch = "main"}
pytune_configuration = { git = "https://github.com/gdefombelle/pytune_configuration.git", branch = "main"}
simple_logger = { git = "https://github.com/gdefombelle/simple_logger.git", branch = "main"}


unidecode = "^1.3.8"
openai = "^1.63.0"
minio = "^7.2.15"
qdrant-client = "^1.14.2"
rapidfuzz = "^3.13.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
pytest-asyncio = "^0.20.3"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"